# Demo policy — used by `lexecon demo` to exercise the block_destructive_shell
# rule (not just the allowlist). rm is intentionally included so the pattern
# match fires and the audit log shows policy_id: "block_destructive_shell".
# Do not use this as a production policy.
allowed_executables:
  - echo
  - ls
  - rm

rules:
  - id: block_destructive_shell
    tool: shell.run
    action: BLOCK
    patterns:
      - "rm -rf"
      - "sudo rm"
      - "mkfs"
      - "diskutil erase"
    reason: "Destructive shell command detected."
